syntax = "proto3";

package vasoli.v1;
option go_package = "vasoli-backend/internal/gen/vasoli/v1";

import "google/protobuf/timestamp.proto";

service InsightsService {
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse);
  rpc GetZine(GetZineRequest) returns (GetZineResponse);
  rpc GetHealthScore(GetHealthScoreRequest) returns (GetHealthScoreResponse);
  rpc GetSpendingAnalytics(GetSpendingAnalyticsRequest) returns (GetSpendingAnalyticsResponse);
  rpc GetMerchantInsights(GetMerchantInsightsRequest) returns (GetMerchantInsightsResponse);
  rpc GetEmergencyFundProgress(GetEmergencyFundProgressRequest) returns (GetEmergencyFundProgressResponse);
}

message GetHealthScoreRequest {}

message HealthScoreFactor {
  string type = 1; // positive, negative, neutral
  string title = 2;
  string description = 3;
  double impact = 4;
}

message HealthScoreInsight {
  string category = 1;
  string tip = 2;
  string priority = 3; // high, medium, low
}

message HealthScoreComponent {
  string name = 1;
  int32 score = 2;
  int32 weight = 3;
  string description = 4;
}

message GetHealthScoreResponse {
  int32 score = 1;
  repeated HealthScoreComponent components = 2;
  repeated HealthScoreFactor factors = 3;
  repeated HealthScoreInsight insights = 4;
}

message GetSummaryRequest {
  string month_year = 1; // Format: YYYY-MM
}

message GetSummaryResponse {
  int64 total_income_paise = 1;
  int64 total_expense_paise = 2;
  int64 balance_paise = 3;
}

message GetZineRequest {
  string month_year = 1;
}

message CategoryInsight {
  string name = 1;
  string icon = 2;
  int64 total_paise = 3;
}

message SpendInsight {
  string merchant = 1;
  int64 amount_paise = 2;
  google.protobuf.Timestamp date = 3;
}

message LeakInsight {
  string category = 1;
  int64 increase_paise = 2;
}

message GetZineResponse {
  string period = 1;
  int64 total_spent_paise = 2;
  int64 total_income_paise = 3;
  int32 transaction_count = 4;
  repeated CategoryInsight top_categories = 5;
  optional SpendInsight biggest_spend = 6;
  int32 streak = 7;
  int64 saved_vs_prev_paise = 8;
  optional LeakInsight leak = 9;
}

message GetSpendingAnalyticsRequest {
  string month_year = 1; // Format: YYYY-MM
}

message CategoryTrend {
  string category_name = 1;
  string category_icon = 2;
  int64 current_paise = 3;
  int64 previous_paise = 4;
  int64 difference_paise = 5;
}

message GetSpendingAnalyticsResponse {
  repeated CategoryTrend trends = 1;
  repeated CategoryInsight top_categories = 2;
}

message GetMerchantInsightsRequest {
  string month_year = 1; // Format: YYYY-MM
}

message MerchantTrend {
  string merchant = 1;
  int64 current_paise = 2;
  int64 previous_paise = 3;
  int32 current_count = 4;
  int64 difference_paise = 5;
}

message SavingsOpportunity {
  string type = 1; // e.g. "HIGH_FREQUENCY_SMALL_SPENDS", "SUBSCRIPTION_LIKE"
  string merchant = 2;
  string description = 3;
  int64 potential_savings_paise = 4;
}

message GetMerchantInsightsResponse {
  repeated MerchantTrend trends = 1;
  repeated MerchantTrend top_merchants = 2;
  repeated SavingsOpportunity savings_opportunities = 3;
}

message GetEmergencyFundProgressRequest {}

message EmergencyFundProgress {
  int64 current_balance_paise = 1;
  int64 average_monthly_expense_paise = 2;
  double months_of_runway = 3;
  int64 target_1_month_paise = 4;
  int64 target_3_month_paise = 5;
  int64 target_6_month_paise = 6;
}

message GetEmergencyFundProgressResponse {
  EmergencyFundProgress progress = 1;
}
