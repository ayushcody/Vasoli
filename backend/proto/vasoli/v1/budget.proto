syntax = "proto3";

package vasoli.v1;
option go_package = "vasoli-backend/internal/gen/vasoli/v1";

import "google/protobuf/timestamp.proto";

service BudgetService {
  rpc CreateBudget(CreateBudgetRequest) returns (CreateBudgetResponse);
  rpc ListBudgets(ListBudgetsRequest) returns (ListBudgetsResponse);
  rpc UpdateBudget(UpdateBudgetRequest) returns (UpdateBudgetResponse);
  rpc DeleteBudget(DeleteBudgetRequest) returns (DeleteBudgetResponse);
  rpc GetSuggestedBudget(GetSuggestedBudgetRequest) returns (GetSuggestedBudgetResponse);
}

message Budget {
  string id = 1;
  string name = 2;
  int64 amount_paise = 3;
  string period = 4; // MONTHLY, WEEKLY
  google.protobuf.Timestamp start_date = 5;
  google.protobuf.Timestamp end_date = 6;
  string categories = 7; // JSON or CSV
  string user_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  int64 spent_paise = 11;
  bool roll_unused_funds = 12;
  bool deduct_overspend = 13;
  float burn_rate_percent = 14;
  string warning_level = 15; // NONE, WARNING, DANGER, EXCEEDED
}

message CreateBudgetRequest {
  string name = 1;
  int64 amount_paise = 2;
  string period = 3;
  google.protobuf.Timestamp start_date = 4;
  google.protobuf.Timestamp end_date = 5;
  string categories = 6;
  bool roll_unused_funds = 7;
  bool deduct_overspend = 8;
}

message CreateBudgetResponse {
  Budget budget = 1;
}

message ListBudgetsRequest {}

message ListBudgetsResponse {
  repeated Budget budgets = 1;
}

message UpdateBudgetRequest {
  string id = 1;
  optional string name = 2;
  optional int64 amount_paise = 3;
  optional string period = 4;
  optional string categories = 5;
  optional bool roll_unused_funds = 6;
  optional bool deduct_overspend = 7;
}

message UpdateBudgetResponse {
  Budget budget = 1;
}

message DeleteBudgetRequest {
  string id = 1;
}

message DeleteBudgetResponse {}

message GetSuggestedBudgetRequest {}

message GetSuggestedBudgetResponse {
  int64 amount_paise = 1;
  string categories = 2;
  string explanation = 3;
}
