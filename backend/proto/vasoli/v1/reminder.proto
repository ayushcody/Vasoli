syntax = "proto3";

package vasoli.v1;
option go_package = "vasoli-backend/internal/gen/vasoli/v1";

import "google/protobuf/timestamp.proto";

service ReminderService {
  rpc CreateReminder(CreateReminderRequest) returns (CreateReminderResponse);
  rpc ListReminders(ListRemindersRequest) returns (ListRemindersResponse);
  rpc UpdateReminder(UpdateReminderRequest) returns (UpdateReminderResponse);
  rpc DeleteReminder(DeleteReminderRequest) returns (DeleteReminderResponse);
  rpc CompleteReminder(CompleteReminderRequest) returns (CompleteReminderResponse);
  rpc SnoozeReminder(SnoozeReminderRequest) returns (SnoozeReminderResponse);
  rpc DismissReminder(DismissReminderRequest) returns (DismissReminderResponse);
}

message Reminder {
  string id = 1;
  string title = 2;
  optional string description = 3;
  string type = 4; // BILL_DUE, GOAL_MILESTONE, BUDGET_ALERT, RECURRING_REVIEW, CUSTOM
  google.protobuf.Timestamp due_date = 5;
  string status = 6; // PENDING, SNOOZED, COMPLETED, DISMISSED
  optional google.protobuf.Timestamp snooze_until = 7;
  string user_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateReminderRequest {
  string title = 1;
  optional string description = 2;
  string type = 3;
  google.protobuf.Timestamp due_date = 4;
}

message CreateReminderResponse {
  Reminder reminder = 1;
}

message ListRemindersRequest {
  optional string status = 1;
  optional bool upcoming = 2;
}

message ListRemindersResponse {
  repeated Reminder reminders = 1;
}

message UpdateReminderRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional google.protobuf.Timestamp due_date = 4;
}

message UpdateReminderResponse {
  Reminder reminder = 1;
}

message DeleteReminderRequest {
  string id = 1;
}

message DeleteReminderResponse {}

message CompleteReminderRequest {
  string id = 1;
}

message CompleteReminderResponse {
  Reminder reminder = 1;
}

message SnoozeReminderRequest {
  string id = 1;
  google.protobuf.Timestamp until = 2;
}

message SnoozeReminderResponse {
  Reminder reminder = 1;
}

message DismissReminderRequest {
  string id = 1;
}

message DismissReminderResponse {
  Reminder reminder = 1;
}
